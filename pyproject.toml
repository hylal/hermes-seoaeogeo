[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-seoaeogeo"
version = "1.0.0"
requires-python = ">=3.11"
description = "Advanced SEO, AEO, and GEO audit toolkit for Hermes Agent with native WordPress integration."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hilaludin Wahid"},
]
dependencies = [
    "typer>=0.9,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "requests>=2.28,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
seoaeogeo = "src.main:cli"

[project.entry-points."hermes_agent.plugins"]
hermes_seoaeogeo = "hermes_seoaeogeo:register"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
